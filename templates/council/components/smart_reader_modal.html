<!-- Smart Audio Reader Component (المقترح م7: القراءة الذكية والصوت العصبي السحابي) -->
<style>
  .smart-reader-overlay {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ffffff;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
    border-top: 4px solid #1B365D;
    z-index: 2050;
    display: none;
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .smart-reader-overlay.show {
    display: block !important;
    transform: translateY(0);
  }
  .smart-reader-content-box {
    max-height: 240px;
    overflow-y: auto;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 1.15rem;
    line-height: 1.9;
    color: #1e293b;
    scroll-behavior: smooth;
  }
  .reader-chunk {
    display: inline;
    padding: 3px 6px;
    margin: 2px 0;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .reader-chunk:hover {
    background-color: #f1f5f9;
    text-decoration: underline;
  }
  .reader-chunk.active-reading {
    background-color: #fef08a !important;
    color: #854d0e !important;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(234, 179, 8, 0.45);
    border-right: 4px solid #ca8a04;
    padding-right: 8px;
  }
  .reader-btn-speed {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .reader-btn-speed.active {
    background-color: #1B365D !important;
    color: #ffffff !important;
    border-color: #1B365D !important;
    font-weight: bold;
  }
</style>

<div id="smartReaderOverlay" class="smart-reader-overlay">
  <div class="container-fluid px-4 py-3">
    <!-- Top Bar: Title + Status + Mode + Close -->
    <div class="d-flex flex-wrap justify-content-between align-items-center pb-2 mb-2 border-bottom">
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary px-3 py-2 fs-6">قارئ المجلس الذكي</span>
        <h6 id="smartReaderTargetTitle" class="mb-0 fw-bold text-dark text-truncate" style="max-width: 450px;">
          جاري تحميل النص...
        </h6>
        <span id="smartReaderStatusBadge" class="badge bg-secondary px-2 py-1">جاهز للقراءة</span>
      </div>

      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <!-- Voice Mode Switcher -->
        <div class="btn-group btn-group-sm">
          <button type="button" id="btnModeNeural" class="btn btn-outline-primary active" onclick="setReaderMode('cloud_neural')">
            صوت عصبي سحابي
          </button>
          <button type="button" id="btnModeLocal" class="btn btn-outline-secondary" onclick="setReaderMode('browser_local')">
            صوت محلي (المتصفح)
          </button>
        </div>
        <button type="button" id="btnSmartReaderClose" class="btn btn-outline-danger btn-sm px-3 fw-bold" onclick="closeSmartReader()" ontouchstart="closeSmartReader()">
          إغلاق القارئ
        </button>
      </div>
    </div>

    <!-- Middle: Synchronized Visual Reading Box -->
    <div class="row mb-2">
      <div class="col-12">
        <div id="smartReaderTextBox" class="smart-reader-content-box">
          <div class="text-center text-muted py-4">انقر على زر "تشغيل القراءة" لبدء الاستماع المتزامن مع النص.</div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls: Progress + Buttons (Explicit Arabic Text) -->
    <div class="d-flex flex-wrap justify-content-between align-items-center pt-1">
      <!-- Main Action Buttons -->
      <div class="d-flex align-items-center gap-2 mb-2 mb-md-0">
        <button type="button" id="btnReaderPlay" class="btn btn-success fw-bold px-4 shadow-sm" onclick="startSmartReader()">
          تشغيل القراءة
        </button>
        <button type="button" id="btnReaderPause" class="btn btn-warning fw-bold px-3 d-none text-dark" onclick="pauseSmartReader()">
          إيقاف مؤقت
        </button>
        <button type="button" id="btnReaderResume" class="btn btn-primary fw-bold px-3 d-none" onclick="resumeSmartReader()">
          استئناف القراءة
        </button>
        <button type="button" id="btnReaderStop" class="btn btn-secondary fw-bold px-3" onclick="stopSmartReader()">
          إيقاف تام
        </button>
      </div>

      <!-- Speed Control Buttons -->
      <div class="d-flex align-items-center gap-1 mb-2 mb-md-0">
        <span class="text-muted small fw-bold me-2">السرعة:</span>
        <button type="button" class="btn btn-outline-secondary reader-btn-speed" onclick="setReaderSpeed(0.75, this)">0.75x بطيء</button>
        <button type="button" class="btn btn-outline-secondary reader-btn-speed" onclick="setReaderSpeed(0.85, this)">0.85x هادئ</button>
        <button type="button" class="btn btn-outline-secondary reader-btn-speed active" onclick="setReaderSpeed(1.0, this)">1.0x طبيعي</button>
        <button type="button" class="btn btn-outline-secondary reader-btn-speed" onclick="setReaderSpeed(1.25, this)">1.25x سريع</button>
        <button type="button" class="btn btn-outline-secondary reader-btn-speed" onclick="setReaderSpeed(1.5, this)">1.5x سريع جداً</button>
      </div>

      <!-- Progress & Chunk Counter -->
      <div class="d-flex align-items-center gap-3">
        <div style="width: 140px;">
          <div class="progress" style="height: 8px;">
            <div id="smartReaderProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%;"></div>
          </div>
        </div>
        <span id="smartReaderProgressText" class="small fw-bold text-muted">0 / 0</span>
      </div>
    </div>
  </div>
</div>

<script>
// Smart Audio Reader Controller
let smartReaderState = {
  active: false,
  paused: false,
  mode: 'cloud_neural', // 'cloud_neural' or 'browser_local'
  speed: 1.0,
  chunks: [],
  currentIndex: 0,
  totalChunks: 0,
  targetTitle: '',
  sessionId: null,
  topicId: null,
  audioElement: null
};

// Initialize HTML5 Audio Element for Cloud Neural mode
if (!smartReaderState.audioElement) {
  smartReaderState.audioElement = new Audio();
  smartReaderState.audioElement.onended = function() {
    advanceToNextChunk();
  };
  smartReaderState.audioElement.onerror = function() {
    console.warn("Cloud Neural audio error, falling back to local speech");
    if (smartReaderState.active && !smartReaderState.paused) {
      playChunkLocal(smartReaderState.chunks[smartReaderState.currentIndex]);
    }
  };
}

// Global reference for Android Chrome Speech Keep-Alive and Timers
window._smartReaderActiveUtterance = null;
window._smartReaderKeepAliveTimer = null;
window._smartReaderSafetyTimer = null;
window._cachedArabicVoice = null;

// Search and select best available Arabic voice on device
function getArabicVoice() {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;

  // 1. Direct Arabic dialect (ar-SA, ar_SA, ar-EG, etc.)
  let v = voices.find(x => x.lang && (x.lang.toLowerCase() === 'ar-sa' || x.lang.toLowerCase() === 'ar_sa'));
  if (v) return v;

  // 2. Any Arabic language tag
  v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith('ar'));
  if (v) return v;

  // 3. Name matches Arabic keywords
  v = voices.find(x => x.name && (x.name.toLowerCase().includes('arabic') || x.name.includes('عربي') || x.name.includes('Tariq') || x.name.includes('Maged') || x.name.includes('Laila')));
  return v || null;
}

// Cache voices as soon as browser registers them
if (typeof window !== 'undefined' && window.speechSynthesis) {
  window._cachedArabicVoice = getArabicVoice();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function() {
      window._cachedArabicVoice = getArabicVoice();
    };
  }
}

// Clean speech text from redundant parenthesized digits like (1) so TTS speaks pure Arabic
function sanitizeArabicSpeech(text) {
  if (!text) return '';
  let s = text;
  // Replace "الموضوع الأول (1)" with "الموضوع الأول"
  s = s.replace(/الموضوع\s+(الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|الحادي\s+عشر|الثاني\s+عشر|الثالث\s+عشر|الرابع\s+عشر|الخامس\s+عشر|السادس\s+عشر|السابع\s+عشر|الثامن\s+عشر|التاسع\s+عشر|العشرون)\s*\(\d+\)/g, 'الموضوع $1');
  // Remove any remaining parenthesized numbers e.g. (1) or (22)
  s = s.replace(/\s*\(\d+\)/g, '');
  // Remove leading bullet symbols
  s = s.replace(/^[\s•\-\*]+/gm, '');
  return s.trim();
}

// Control progress bar animation
function setProgressBarAnimation(active) {
  const pBar = document.getElementById('smartReaderProgressBar');
  if (!pBar) return;
  if (active) {
    pBar.classList.add('progress-bar-animated');
  } else {
    pBar.classList.remove('progress-bar-animated');
  }
}

function openSmartReader(params) {
  params = params || {};
  const topicId = (params.topicId && params.topicId !== '0' && params.topicId !== 0) ? params.topicId : null;
  const sessionId = params.sessionId || null;

  if (!topicId && !sessionId) {
    alert('يرجى تحديد الموضوع أو الجلسة المراد قراءتها.');
    return;
  }

  smartReaderState.sessionId = sessionId;
  smartReaderState.topicId = topicId;

  const overlay = document.getElementById('smartReaderOverlay');
  overlay.style.display = 'block';
  setTimeout(() => overlay.classList.add('show'), 20);

  document.getElementById('smartReaderStatusBadge').className = 'badge bg-warning text-dark px-2 py-1';
  document.getElementById('smartReaderStatusBadge').innerText = 'جاري تحضير النص...';

  let url = '/api/smart-reader/data/?';
  if (topicId) url += 'topic_id=' + topicId;
  else if (sessionId) url += 'session_id=' + sessionId;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        alert(data.error || 'تعذر تحميل النص للقراءة الذكية');
        closeSmartReader();
        return;
      }

      smartReaderState.chunks = data.chunks;
      smartReaderState.totalChunks = data.total_chunks;
      smartReaderState.targetTitle = data.title;
      smartReaderState.currentIndex = 0;

      // تطبيق إعدادات السيرفر المعتمدة (النمط والسرعة واللون)
      if (data.settings) {
        if (data.settings.voice_mode) {
          setReaderMode(data.settings.voice_mode);
        }
        if (data.settings.default_speed) {
          setReaderSpeed(parseFloat(data.settings.default_speed));
        }
        if (data.settings.highlight_color) {
          smartReaderState.highlightColor = data.settings.highlight_color;
        }
      }

      document.getElementById('smartReaderTargetTitle').innerText = data.title;
      document.getElementById('smartReaderProgressText').innerText = `0 / ${data.total_chunks}`;
      document.getElementById('smartReaderProgressBar').style.width = '0%';
      setProgressBarAnimation(false);
      document.getElementById('smartReaderStatusBadge').className = 'badge bg-success px-2 py-1';
      document.getElementById('smartReaderStatusBadge').innerText = 'جاهز للقراءة';

      renderChunksInBox(data.chunks);
    })
    .catch(err => {
      console.error(err);
      alert('خطأ في الاتصال بخدمة القراءة الذكية');
      closeSmartReader();
    });
}

function closeSmartReader() {
  try {
    stopSmartReader();
  } catch (e) {
    console.error("Error in stopSmartReader:", e);
  }

  const overlay = document.getElementById('smartReaderOverlay');
  if (overlay) {
    overlay.classList.remove('show');
    // Definitive hidden style
    setTimeout(() => {
      if (!overlay.classList.contains('show')) {
        overlay.style.display = 'none';
      }
    }, 250);
  }
}

function renderChunksInBox(chunks) {
  const box = document.getElementById('smartReaderTextBox');
  box.innerHTML = '';

  chunks.forEach((chunk, i) => {
    const span = document.createElement('span');
    span.id = 'chunk_dom_' + i;
    span.className = 'reader-chunk' + (chunk.is_header ? ' fw-bold d-block my-2 text-primary' : '');
    span.innerText = chunk.text + ' ';
    span.title = 'انقر للاستماع من هذه الفقرة مباشرة';
    span.onclick = function() {
      jumpToChunk(i);
    };
    box.appendChild(span);
  });
}

function setReaderMode(mode) {
  smartReaderState.mode = mode;
  document.getElementById('btnModeNeural').classList.toggle('active', mode === 'cloud_neural');
  document.getElementById('btnModeLocal').classList.toggle('active', mode === 'browser_local');

  if (smartReaderState.active && !smartReaderState.paused) {
    playCurrentChunk();
  }
}

function setReaderSpeed(speed, btn) {
  smartReaderState.speed = speed;
  document.querySelectorAll('.reader-btn-speed').forEach(b => {
    b.classList.remove('active');
    if (!btn && b.textContent.includes(speed + 'x')) {
      b.classList.add('active');
    }
  });
  if (btn) btn.classList.add('active');

  if (smartReaderState.audioElement) {
    smartReaderState.audioElement.playbackRate = speed;
  }
  if (smartReaderState.active && !smartReaderState.paused && smartReaderState.mode === 'browser_local') {
    window.speechSynthesis.cancel();
    playChunkLocal(smartReaderState.chunks[smartReaderState.currentIndex]);
  }
}

let _hasLoggedThisRun = false;

function startSmartReader() {
  if (!smartReaderState.chunks || smartReaderState.chunks.length === 0) return;

  smartReaderState.active = true;
  smartReaderState.paused = false;
  _hasLoggedThisRun = false;

  document.getElementById('btnReaderPlay').classList.add('d-none');
  document.getElementById('btnReaderPause').classList.remove('d-none');
  document.getElementById('btnReaderResume').classList.add('d-none');
  document.getElementById('smartReaderStatusBadge').className = 'badge bg-primary px-2 py-1';
  document.getElementById('smartReaderStatusBadge').innerText = 'جاري القراءة الآن...';

  setProgressBarAnimation(true);
  if (smartReaderState.mode === 'browser_local') {
    logReaderUsage('browser_local');
  }
  playCurrentChunk();
}

function pauseSmartReader() {
  smartReaderState.paused = true;

  if (window._smartReaderSafetyTimer) clearTimeout(window._smartReaderSafetyTimer);

  setProgressBarAnimation(false);

  if (smartReaderState.mode === 'cloud_neural' && smartReaderState.audioElement) {
    smartReaderState.audioElement.pause();
  } else {
    try { window.speechSynthesis.cancel(); } catch(e) {}
  }

  document.getElementById('btnReaderPause').classList.add('d-none');
  document.getElementById('btnReaderResume').classList.remove('d-none');
  document.getElementById('smartReaderStatusBadge').className = 'badge bg-warning text-dark px-2 py-1';
  document.getElementById('smartReaderStatusBadge').innerText = 'متوقف مؤقتاً';
}

function resumeSmartReader() {
  smartReaderState.paused = false;

  setProgressBarAnimation(true);

  if (smartReaderState.mode === 'cloud_neural' && smartReaderState.audioElement && smartReaderState.audioElement.src) {
    smartReaderState.audioElement.play();
  } else {
    playCurrentChunk();
  }

  document.getElementById('btnReaderResume').classList.add('d-none');
  document.getElementById('btnReaderPause').classList.remove('d-none');
  document.getElementById('smartReaderStatusBadge').className = 'badge bg-primary px-2 py-1';
  document.getElementById('smartReaderStatusBadge').innerText = 'جاري القراءة الآن...';
}

function stopSmartReader() {
  smartReaderState.active = false;
  smartReaderState.paused = false;

  if (window._smartReaderKeepAliveTimer) clearInterval(window._smartReaderKeepAliveTimer);
  if (window._smartReaderSafetyTimer) clearTimeout(window._smartReaderSafetyTimer);
  window._smartReaderActiveUtterance = null;

  setProgressBarAnimation(false);

  if (smartReaderState.audioElement) {
    try {
      smartReaderState.audioElement.pause();
      smartReaderState.audioElement.currentTime = 0;
    } catch(e) {}
  }
  try {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  } catch(e) {}

  // Clear visual highlights
  document.querySelectorAll('.reader-chunk').forEach(el => el.classList.remove('active-reading'));

  document.getElementById('btnReaderPlay').classList.remove('d-none');
  document.getElementById('btnReaderPause').classList.add('d-none');
  document.getElementById('btnReaderResume').classList.add('d-none');
  document.getElementById('smartReaderStatusBadge').className = 'badge bg-secondary px-2 py-1';
  document.getElementById('smartReaderStatusBadge').innerText = 'متوقف';
}

function jumpToChunk(index) {
  smartReaderState.currentIndex = index;
  if (!smartReaderState.active) {
    startSmartReader();
  } else {
    smartReaderState.paused = false;
    document.getElementById('btnReaderResume').classList.add('d-none');
    document.getElementById('btnReaderPause').classList.remove('d-none');
    playCurrentChunk();
  }
}

function playCurrentChunk() {
  if (smartReaderState.currentIndex >= smartReaderState.chunks.length) {
    stopSmartReader();
    setProgressBarAnimation(false);
    document.getElementById('smartReaderStatusBadge').className = 'badge bg-success px-2 py-1';
    document.getElementById('smartReaderStatusBadge').innerText = 'اكتملت القراءة';
    return;
  }

  const chunk = smartReaderState.chunks[smartReaderState.currentIndex];
  updateVisualHighlight(smartReaderState.currentIndex);

  if (smartReaderState.mode === 'cloud_neural') {
    playChunkNeural(chunk);
  } else {
    playChunkLocal(chunk);
  }
}

function updateVisualHighlight(index) {
  document.querySelectorAll('.reader-chunk').forEach(el => el.classList.remove('active-reading'));
  const currentDom = document.getElementById('chunk_dom_' + index);
  if (currentDom) {
    currentDom.classList.add('active-reading');
    currentDom.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  const total = smartReaderState.totalChunks;
  const current = index + 1;
  const pct = Math.round((current / total) * 100);
  document.getElementById('smartReaderProgressBar').style.width = pct + '%';
  document.getElementById('smartReaderProgressText').innerText = `${current} / ${total} (${pct}%)`;
}

function playChunkNeural(chunk) {
  const currentIdx = smartReaderState.currentIndex;
  fetch('/api/smart-reader/synthesize/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      text: chunk.text,
      speed: smartReaderState.speed
    })
  })
  .then(r => r.json())
  .then(res => {
    if (!smartReaderState.active || smartReaderState.paused || smartReaderState.currentIndex !== currentIdx) return;
    if (res.success && res.audio_url) {
      logReaderUsage('cloud_neural');
      smartReaderState.audioElement.src = res.audio_url;
      smartReaderState.audioElement.playbackRate = smartReaderState.speed;
      smartReaderState.audioElement.play().catch(e => {
        console.warn("Autoplay audio blocked, falling back to local speech");
        if (smartReaderState.active && !smartReaderState.paused && smartReaderState.currentIndex === currentIdx) {
          logReaderUsage('browser_local');
          playChunkLocal(chunk);
        }
      });
    } else {
      // Local fallback
      logReaderUsage('browser_local');
      playChunkLocal(chunk);
    }
  })
  .catch(err => {
    if (!smartReaderState.active || smartReaderState.paused || smartReaderState.currentIndex !== currentIdx) return;
    console.warn("Neural synthesis fetch failed, falling back to local speech:", err);
    logReaderUsage('browser_local');
    playChunkLocal(chunk);
  });
}

function playChunkLocal(chunk) {
  if (!smartReaderState.active || smartReaderState.paused) return;

  if (window._smartReaderSafetyTimer) clearTimeout(window._smartReaderSafetyTimer);

  const currentIdx = smartReaderState.currentIndex;
  try {
    window.speechSynthesis.cancel();
  } catch(e) {}

  // Clean text from English numbers e.g. (1) and formatting symbols
  const cleanText = sanitizeArabicSpeech(chunk.text);
  if (!cleanText) {
    advanceToNextChunk();
    return;
  }

  const utterance = new SpeechSynthesisUtterance(cleanText);
  window._smartReaderActiveUtterance = utterance;

  // Prevent Chrome garbage collection of active utterance
  window._speechUtteranceHolder = window._speechUtteranceHolder || [];
  window._speechUtteranceHolder.push(utterance);

  // Assign Arabic Voice explicitly
  const arVoice = getArabicVoice() || window._cachedArabicVoice;
  if (arVoice) {
    utterance.voice = arVoice;
    utterance.lang = arVoice.lang;
  } else {
    utterance.lang = 'ar-SA';
  }

  utterance.rate = smartReaderState.speed || 1.0;

  const cleanupAndAdvance = () => {
    if (window._smartReaderSafetyTimer) clearTimeout(window._smartReaderSafetyTimer);
    window._smartReaderActiveUtterance = null;
    if (window._speechUtteranceHolder) {
      const idx = window._speechUtteranceHolder.indexOf(utterance);
      if (idx > -1) window._speechUtteranceHolder.splice(idx, 1);
    }
    if (smartReaderState.active && !smartReaderState.paused && smartReaderState.currentIndex === currentIdx) {
      advanceToNextChunk();
    }
  };

  utterance.onend = cleanupAndAdvance;
  utterance.onerror = function(e) {
    if (e && (e.error === 'canceled' || e.error === 'interrupted')) {
      return;
    }
    console.warn("Local speech error:", e);
    cleanupAndAdvance();
  };

  // Safe generous watchdog ONLY to prevent indefinite hang (90 seconds)
  window._smartReaderSafetyTimer = setTimeout(() => {
    if (smartReaderState.active && !smartReaderState.paused && smartReaderState.currentIndex === currentIdx) {
      console.warn("Watchdog timeout reached, advancing chunk");
      cleanupAndAdvance();
    }
  }, 90000);

  // Slight 40ms delay after cancel to allow Android audio focus reset
  setTimeout(() => {
    if (!smartReaderState.active || smartReaderState.paused || smartReaderState.currentIndex !== currentIdx) return;
    try {
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      console.warn("Speech synthesis speak error:", e);
      cleanupAndAdvance();
    }
  }, 40);
}

function advanceToNextChunk() {
  if (!smartReaderState.active || smartReaderState.paused) return;
  smartReaderState.currentIndex++;
  playCurrentChunk();
}

function logReaderUsage(overrideMode) {
  if (_hasLoggedThisRun && !overrideMode) return;
  _hasLoggedThisRun = true;
  const effectiveMode = overrideMode || (smartReaderState.actualMode || smartReaderState.mode);
  fetch('/api/smart-reader/log/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      session_id: smartReaderState.sessionId,
      topic_id: smartReaderState.topicId,
      target_title: smartReaderState.targetTitle,
      voice_mode: effectiveMode,
      speed: smartReaderState.speed,
      chunks_count: smartReaderState.totalChunks
    })
  }).catch(e => console.log(e));
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
